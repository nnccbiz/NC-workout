<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אימון כושר</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Heebo', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Heebo', sans-serif;
      background-color: #121212;
      color: #ffffff;
    }
    .card {
      background-color: #1e1e1e;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:active {
      transform: scale(0.97);
    }
    @media (hover: hover) {
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 20px rgba(0, 230, 118, 0.15);
      }
    }
    .tab-active {
      background-color: #00e676;
      color: #121212;
      font-weight: 700;
    }
    .tab-inactive {
      background-color: #2a2a2a;
      color: #9e9e9e;
    }
  </style>
</head>
<body class="min-h-screen pb-8">
  <header class="sticky top-0 z-10 bg-[#121212] pt-4 pb-2 px-4">
    <h1 class="text-center text-2xl font-bold mb-4 text-[#00e676]">💪 אימון כושר</h1>
    <div class="flex gap-2">
      <button id="tab-a" onclick="switchTab('a')" class="flex-1 py-3 rounded-xl text-lg transition-colors duration-200">
        אימון A
      </button>
      <button id="tab-b" onclick="switchTab('b')" class="flex-1 py-3 rounded-xl text-lg transition-colors duration-200">
        אימון B
      </button>
    </div>
  </header>

  <main class="px-4 mt-4">
    <p id="subtitle-a" class="text-sm text-gray-400 mb-3 hidden">פלג גוף עליון וכוח</p>
    <p id="subtitle-b" class="text-sm text-gray-400 mb-3 hidden">ליבה, רגליים ויציבות</p>

    <div id="grid-a" class="grid grid-cols-2 gap-3 hidden"></div>
    <div id="grid-b" class="grid grid-cols-2 gap-3 hidden"></div>
  </main>

  <script>
    const workoutA = [
      { name: "עליות מתח (טכניקה)", url: "https://www.youtube.com/watch?v=RoxKbyst0To", icon: "arrow-up-circle" },
      { name: "מקבילים (Dips)", url: "https://www.youtube.com/watch?v=2Tz7LpA3PzY", icon: "arrow-down-circle" },
      { name: "שכיבות סמיכה ספינקס (יד אחורית)", url: "https://www.youtube.com/watch?v=Xz7K6K6u5r8", icon: "move-horizontal" },
      { name: "איך לעשות יותר מתח (מתקדם)", url: "https://www.youtube.com/watch?v=ZfX_E4lYjB0", icon: "trending-up" },
      { name: "יד קדמית על המתח", url: "https://www.youtube.com/watch?v=R9YqNf4F0Gk", icon: "grip-horizontal" },
      { name: "וריאציות שכיבות סמיכה", url: "https://www.youtube.com/watch?v=7_hKj8Nf-vE", icon: "repeat" },
      { name: "עמידת צפרדע (Frog Stand)", url: "https://www.youtube.com/watch?v=F0S1_WvG80c", icon: "hand" },
      { name: "חזה וכתפיים (מקבילים נמוכים)", url: "https://www.youtube.com/watch?v=vV_n3JmS_oU", icon: "dumbbell" },
    ];

    const workoutB = [
      { name: "אימון רגליים מלא (15 דקות)", url: "https://www.youtube.com/watch?v=svoaqltrANc", icon: "footprints" },
      { name: "אימון בטן מתקדם (15 דקות)", url: "https://www.youtube.com/watch?v=u5M011lRLak", icon: "flame" },
      { name: "הרמות רגליים (Leg Raises)", url: "https://youtube.com/shorts/VFjA6-65b2c", icon: "move-vertical" },
      { name: "גשר (Glute Bridge)", url: "https://youtube.com/shorts/X_IGw8U_e38", icon: "bridge" },
      { name: "יסודות ליבה ופלאנק", url: "https://www.youtube.com/watch?v=axnHz5iPYCk", icon: "shield" },
      { name: "תרגילי רגליים וסקוואט", url: "https://www.youtube.com/watch?v=9K9lTOQ8uEM", icon: "zap" },
    ];

    function createCard(exercise) {
      return `
        <a href="${exercise.url}" target="_blank" rel="noopener noreferrer"
           class="card rounded-2xl p-4 flex flex-col items-center justify-center gap-3 text-center min-h-[130px] no-underline">
          <i data-lucide="${exercise.icon}" class="w-8 h-8 text-[#00e676]"></i>
          <span class="text-sm font-medium leading-tight text-gray-200">${exercise.name}</span>
        </a>
      `;
    }

    function renderCards() {
      document.getElementById('grid-a').innerHTML = workoutA.map(createCard).join('');
      document.getElementById('grid-b').innerHTML = workoutB.map(createCard).join('');
      lucide.createIcons();
    }

    function switchTab(tab) {
      const isA = tab === 'a';

      document.getElementById('tab-a').className = `flex-1 py-3 rounded-xl text-lg transition-colors duration-200 ${isA ? 'tab-active' : 'tab-inactive'}`;
      document.getElementById('tab-b').className = `flex-1 py-3 rounded-xl text-lg transition-colors duration-200 ${isA ? 'tab-inactive' : 'tab-active'}`;

      document.getElementById('grid-a').classList.toggle('hidden', !isA);
      document.getElementById('grid-b').classList.toggle('hidden', isA);
      document.getElementById('subtitle-a').classList.toggle('hidden', !isA);
      document.getElementById('subtitle-b').classList.toggle('hidden', isA);

      localStorage.setItem('lastWorkout', tab);
    }

    // Init
    renderCards();
    const lastTab = localStorage.getItem('lastWorkout') || 'a';
    switchTab(lastTab);
  </script>
</body>
</html>
